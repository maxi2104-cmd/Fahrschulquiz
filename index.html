<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ON TRACK – Fahrschule Quiz</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="On Track">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%}
body.splash{padding:0;overflow:hidden;background:#000}
.sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center}
/* 1. Hintergrund */
.sp-bg{position:fixed;inset:0;background:var(--bg);opacity:0;animation:sp-fade .7s ease-out .1s forwards}
/* 2. Striche */
.sp-lines{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.sp-lines span{position:absolute;left:-40%;width:180%;height:var(--h);background:var(--c);transform:rotate(-12deg) scaleX(0);transform-origin:left top;
  animation:sp-draw .7s cubic-bezier(.65,0,.35,1) var(--t) forwards}
.sp-band{position:fixed;left:-40%;width:180%;top:calc(86% + 6px);height:120%;background:var(--band);transform:rotate(-12deg);transform-origin:left top;opacity:0;animation:sp-fade .6s ease-out 1.25s forwards}
/* 3. Hirsch */
.sp-deer{position:relative;width:min(88vw,500px);max-height:58vh;aspect-ratio:295/285;opacity:0;transform:scale(.82) translateY(14px);
  animation:sp-deer 1s cubic-bezier(.2,.8,.2,1) 1.5s forwards}
.sp-deer i{display:block;width:100%;height:100%;background:#c2e54d;will-change:transform;
  -webkit-mask:url(logo.svg) center/contain no-repeat;mask:url(logo.svg) center/contain no-repeat;
  animation:sp-pulse 2.4s ease-in-out 2.5s infinite,sp-tone 7.2s ease-in-out 2.5s infinite}
@keyframes sp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes sp-tone{0%,100%{background:#c2e54d}25%{background:#d8f27e}50%{background:#a9d936}75%{background:#e6f9a8}}
.sp-name{position:relative;opacity:0;animation:sp-up .7s ease-out 2.2s forwards}
.sp-name b{display:block;font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:.32em;margin-right:-.32em;color:var(--text)}
.sp-name small{display:block;margin-top:6px;font-size:12px;letter-spacing:.24em;color:var(--muted)}
/* 4. Buttons */
.sp-btns{position:relative;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.sp-btns .btn{margin:0;opacity:0;animation:sp-up .6s ease-out forwards}
.sp-btns .btn:nth-child(1){animation-delay:2.6s}
.sp-btns .btn:nth-child(2){animation-delay:2.8s}
.sp-btns .btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;font-size:15px;padding:0 12px}
.sp-skip{position:fixed;inset:0;z-index:1;background:transparent;border:0}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-draw{to{transform:rotate(-12deg) scaleX(1)}}
@keyframes sp-deer{to{opacity:1;transform:none}}
@keyframes sp-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
body.done .sp-bg,body.done .sp-band,body.done .sp-lines span,body.done .sp-deer,body.done .sp-name,body.done .sp-btns .btn{animation-duration:0s!important;animation-delay:0s!important}
body.done .sp-deer i{animation-delay:0s!important}
@media (prefers-reduced-motion: reduce){.sp *, .sp-bg, .sp-band, .sp-lines span{animation-duration:0s!important;animation-delay:0s!important}}
/* Installations-Hinweis */
.ins{position:fixed;inset:0;z-index:30;background:rgba(5,7,10,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.ins[hidden]{display:none}
.ins-box{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;text-align:left}
.ins-box h2{margin:0 0 6px;font-size:20px;letter-spacing:.06em}
.ins-box p{color:var(--muted);margin:0 0 14px;line-height:1.5}
.ins-box ol{margin:0 0 18px;padding-left:22px;line-height:1.7}
.ins-box li b{color:var(--lime)}
</style>
</head>
<body class="splash">
<div class="sp-bg" aria-hidden="true"></div>
<div class="sp-band" aria-hidden="true"></div>
<div class="sp-lines" aria-hidden="true">
  <span style="--h:6px;--c:var(--lime);top:9%;--t:.7s"></span>
  <span style="--h:3px;--c:var(--lime-d);top:13%;--t:.85s"></span>
  <span style="--h:2px;--c:var(--line);top:5%;--t:1s"></span>
  <span style="--h:6px;--c:var(--lime);top:86%;--t:1.1s;z-index:1"></span>
</div>

<main class="sp">
  <button class="sp-skip" aria-label="Animation überspringen" onclick="document.body.classList.add('done');this.remove()"></button>
  <div class="sp-deer" role="img" aria-label="On Track Logo"><i></i></div>
  <div class="sp-btns">
    <a class="btn" href="auswahl.html">ZUR QUIZAUSWAHL</a>
    <button id="btn-install" class="btn" type="button">QUIZ ALS APP INSTALLIEREN</button>
  </div>
</main>

<div id="ins" class="ins" hidden>
  <div class="ins-box" role="dialog" aria-modal="true" aria-labelledby="ins-h">
    <h2 id="ins-h">APP INSTALLIEREN</h2>
    <p id="ins-p"></p>
    <ol id="ins-steps"></ol>
    <button id="ins-close" class="btn" type="button">VERSTANDEN</button>
  </div>
</div>

<script>
setTimeout(() => { const s = document.querySelector(".sp-skip"); if (s) s.remove(); }, 3400);
(() => {
  const btn = document.getElementById("btn-install");
  const ua = navigator.userAgent;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const inApp = /Instagram|FBAN|FBAV|FB_IAB|Line\/|WhatsApp|TikTok|Snapchat/i.test(ua);
  const iosOther = isIOS && /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  const isAndroid = /Android/.test(ua);
  let deferred = null;

  if (standalone) { btn.textContent = "APP IST INSTALLIERT ✓"; btn.disabled = true; }

  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; });
  window.addEventListener("appinstalled", () => { btn.textContent = "APP IST INSTALLIERT ✓"; btn.disabled = true; });

  const box = document.getElementById("ins"), p = document.getElementById("ins-p"), ol = document.getElementById("ins-steps");
  function show(text, steps) {
    p.textContent = text;
    ol.innerHTML = steps.map(s => "<li>" + s + "</li>").join("");
    box.hidden = false;
  }
  document.getElementById("ins-close").onclick = () => { box.hidden = true; };
  box.addEventListener("click", (e) => { if (e.target === box) box.hidden = true; });

  btn.addEventListener("click", async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; return; }
    if (inApp) {
      show("Du bist gerade im Browser einer anderen App (z. B. Instagram oder WhatsApp). Dort kann man nichts installieren.",
        ["Tippe oben rechts auf <b>•••</b> bzw. <b>⋮</b>", "Wähle <b>„In Safari öffnen“</b> bzw. <b>„Im Browser öffnen“</b>", "Tippe dort noch einmal auf <b>„Quiz als App installieren“</b>"]);
    } else if (iosOther) {
      show("Auf dem iPhone und iPad klappt die Installation am zuverlässigsten mit Safari.",
        ["Kopiere die Adresse dieser Seite", "Öffne sie in <b>Safari</b>", "Tippe dort noch einmal auf <b>„Quiz als App installieren“</b>"]);
    } else if (isIOS) {
      show("So legst du das Quiz als App auf deinen Home-Bildschirm:",
        ["Tippe in Safari auf das <b>Teilen-Symbol</b> (Quadrat mit Pfeil nach oben)", "Scrolle nach unten und wähle <b>„Zum Home-Bildschirm“</b>", "Tippe oben rechts auf <b>„Hinzufügen“</b>"]);
    } else if (isAndroid) {
      show("So installierst du das Quiz als App:",
        ["Tippe in Chrome oben rechts auf <b>⋮</b>", "Wähle <b>„App installieren“</b> oder <b>„Zum Startbildschirm hinzufügen“</b>", "Bestätige mit <b>„Installieren“</b>"]);
    } else {
      show("Am Computer kannst du das Quiz über die Adressleiste installieren:",
        ["Klicke in Chrome oder Edge rechts in der Adressleiste auf das <b>Installieren-Symbol</b>", "Bestätige mit <b>„Installieren“</b>", "Am besten geht es aber auf dem Handy"]);
    }
  });
})();
</script>
</body>
</html>
