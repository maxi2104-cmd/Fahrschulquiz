<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Host – ON TRACK Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="card wide">
  <header class="brand">
    <div class="logo">ON TRACK</div>
    <div class="sub">HOST · QUIZ-ERGEBNISSE</div>
    <div class="dash"></div>
  </header>

  <section id="login" class="screen" style="max-width:520px;margin:0 auto">
    <h1 class="title">HOST<br>LOGIN.</h1>
    <label class="lbl" for="email">E-MAIL</label>
    <input id="email" class="inp" type="email" autocomplete="username">
    <label class="lbl" for="pw">PASSWORT</label>
    <input id="pw" class="inp" type="password" autocomplete="current-password">
    <p id="login-err" class="err" hidden style="margin-top:14px"></p>
    <button id="btn-login" class="btn" style="margin-top:22px">ANMELDEN</button>
  </section>

  <section id="dash" class="screen" hidden>
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <label class="lbl" for="quiz-select" style="margin:0">QUIZ</label>
        <select id="quiz-select" class="inp"></select>
        <label class="lbl" for="round-select" style="margin:0">RUNDE</label>
        <select id="round-select" class="inp"></select>
      </div>
      <div class="row">
        <button id="btn-csv" class="btn ghost">CSV EXPORT</button>
        <button id="btn-new" class="btn">NEUE RUNDE</button>
        <button id="btn-logout" class="btn ghost">ABMELDEN</button>
      </div>
    </div>
    <p class="hint" id="current-info"></p>
    <div class="row" style="margin-top:8px">
      <div class="stat"><b id="s-count">0</b><span>Teilnehmer</span></div>
      <div class="stat"><b id="s-avg">0</b><span>Ø Punkte</span></div>
      <div class="stat"><b id="s-best">–</b><span>Beste Leistung</span></div>
      <div class="stat"><b id="s-hard">–</b><span>Schwerste Frage</span></div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th>NAME</th><th>PUNKTE</th><th>RICHTIG</th><th>FALSCH BEI</th><th>ZEIT</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="7">Lade …</td></tr></tbody>
      </table>
    </div>
  </section>
  <footer class="foot">Nur für die Fahrschule On Track</footer>
</main>
<script type="module" src="host.js"></script>
</body>
</html>
